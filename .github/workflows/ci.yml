name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automation-tool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/automation-tool
      CDE_SESSION_ENCRYPTION_KEY: ci-automation-tool-encryption-key-32chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-recorder-extension
          path: artifacts/extension/extension.zip
          if-no-files-found: error
          retention-days: 14
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
